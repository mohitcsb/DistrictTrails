<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>District Travel Tracker & Timeline</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --dark: #1e293b;
      --gray: #64748b;
      --light-bg: #f8fafc;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--light-bg); color: var(--dark); padding-bottom: 40px; }

    /* Header */
    header { background: #fff; border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--dark); }
    .header-actions { display: flex; gap: 10px; }

    /* Layout Container */
    .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }

    /* Buttons */
    .btn { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: white; border: 1px solid var(--border); color: var(--dark); }
    .btn-secondary:hover { background: var(--light-bg); }
    .icon-button { background: none; border: 1px solid var(--border); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    .icon-button.danger { color: var(--danger); border-color: #fca5a5; }

    /* Timeline Styling */
    .timeline { position: relative; padding-left: 20px; border-left: 2px solid var(--border); margin-top: 1rem; }
    .timeline-item { position: relative; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; }
    .timeline-item::before { content: ''; position: absolute; left: -27px; top: 18px; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); border: 2px solid #fff; }
    .timeline-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .timeline-date { font-size: 0.8rem; color: var(--gray); font-weight: 600; margin-bottom: 4px; }
    .card-actions { display: flex; gap: 8px; }

    /* Modal Styling */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
    .modal.active { display: flex; }
    .modal-content { background: white; border-radius: 8px; padding: 1.5rem; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 4px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
    
    .empty { text-align: center; color: var(--gray); padding: 2rem; }
  </style>
</head>
<body>

  <!-- Top Global Header -->
  <header>
    <h1>Travel Tracker</h1>
    <div class="header-actions">
      <button class="btn btn-secondary" onclick="loadTrips()">🔄 Refresh</button>
      <button class="btn" id="addDistrictBtn" style="display:none;" onclick="openAddModal()">+ Add District</button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="container">
    <h2>Timeline</h2>
    <div id="timelineList" class="timeline">
      <div class="empty">Loading events...</div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal" id="tripModal">
    <div class="modal-content">
      <h3 id="modalTitle" style="margin-bottom:1rem;">Add New District</h3>
      <form id="tripForm" onsubmit="handleFormSubmit(event)">
        <div class="form-group">
          <label for="district">District Name</label>
          <input type="text" id="district" required />
        </div>
        
        <div class="form-group">
          <label for="place">Specific Place / Spot</label>
          <input type="text" id="place" />
        </div>

        <div class="form-group">
          <label for="dateType">Date Selection</label>
          <select id="dateType" onchange="toggleDateInputs()">
            <option value="single">Single Date</option>
            <option value="range">Date Range</option>
          </select>
        </div>

        <div class="form-group" id="singleDateGroup">
          <label for="dateVal">Date</label>
          <input type="date" id="dateVal" />
        </div>

        <div class="form-group" id="rangeDateGroup" style="display:none;">
          <label for="dateFrom">From Date</label>
          <input type="date" id="dateFrom" style="margin-bottom: 8px;" />
          <label for="dateTo">To Date</label>
          <input type="date" id="dateTo" />
        </div>

        <div class="form-group">
          <label for="rating">Rating (1-5)</label>
          <input type="number" id="rating" min="1" max="5" value="5" />
        </div>

        <div class="form-group">
          <label for="tags">Tags (comma separated)</label>
          <input type="text" id="tags" placeholder="nature, hill, beach" />
        </div>

        <div class="form-group">
          <label for="note">Notes / Memories</label>
          <textarea id="note" rows="3"></textarea>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:1rem;">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn" id="saveButton">Save Entry</button>
        </div>
        <div id="uploadStatus" style="font-size:0.8rem; color:var(--gray); margin-top:8px;"></div>
      </form>
    </div>
  </div>

  <script>
    // Configuration
    const SCRIPT_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL"; // REPLACE WITH YOUR DEPLOYMENT URL
    
    // Application State
    let trips = [];
    let editingId = null;
    let isEditMode = false;
    let adminKey = "";

    // Initialization
    window.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      adminKey = urlParams.get("key") || "";
      
      if (adminKey) {
        isEditMode = true;
        document.getElementById("addDistrictBtn").style.display = "inline-block";
      }

      loadTrips();
    });

    // API Wrapper
    async function callApi(payload) {
      if (isEditMode) {
        payload.adminKey = adminKey;
      }
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      return await response.json();
    }

    // Load Data
    async function loadTrips() {
      const container = document.getElementById("timelineList");
      container.innerHTML = '<div class="empty">Loading events...</div>';
      
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getTrips`);
        const data = await response.json();
        trips = data.trips || [];
        renderTimeline();
      } catch (err) {
        console.error("Failed to load trips:", err);
        container.innerHTML = '<div class="empty">Failed to load data. Please check connection.</div>';
      }
    }

    // Render Timeline View
    function renderTimeline() {
      const container = document.getElementById("timelineList");

      if (!trips.length) {
        container.innerHTML = '<div class="empty">No events on timeline.</div>';
        return;
      }

      // Sort newest to oldest based on dateValue
      const sorted = [...trips].sort((a,b) => (b.dateValue || "").localeCompare(a.dateValue || ""));

      container.innerHTML = sorted.map(t => `
        <div class="timeline-item">
          <div class="timeline-header">
            <div>
              <div class="timeline-date">${formatDateValue(t)}</div>
              <strong style="font-size:1.1rem; color:var(--dark);">${escapeHtml(t.district)}</strong> 
              ${t.place ? `<span style="color:var(--gray)">— ${escapeHtml(t.place)}</span>` : ""}
            </div>
            ${isEditMode ? `
              <div class="card-actions">
                <button class="icon-button" onclick="event.stopPropagation(); openEditModal('${t.id}')">✏️ Edit</button>
                <button class="icon-button danger" onclick="event.stopPropagation(); deleteTrip('${t.id}')">🗑 Delete</button>
              </div>
            ` : ""}
          </div>
          ${t.note ? `<p style="margin:8px 0 0; color:#526579; font-size:.9rem;">${escapeHtml(t.note)}</p>` : ""}
        </div>
      `).join("");
    }

    // Form Handling (Add/Edit)
    async function handleFormSubmit(e) {
      e.preventDefault();
      const saveBtn = document.getElementById("saveButton");
      const statusEl = document.getElementById("uploadStatus");
      saveBtn.disabled = true;
      statusEl.textContent = "Saving...";

      try {
        const dt = document.getElementById("dateType").value;
        let dateVal = "";
        
        if (dt === "range") {
          const from = document.getElementById("dateFrom").value;
          const to = document.getElementById("dateTo").value;
          dateVal = `${from}:${to}`;
        } else {
          dateVal = document.getElementById("dateVal").value;
        }

        const payload = {
          action: editingId ? "updateTrip" : "addTrip",
          id: editingId || String(Date.now()),
          district: document.getElementById("district").value,
          place: document.getElementById("place").value,
          dateType: dt,
          dateValue: dateVal,
          rating: Number(document.getElementById("rating").value),
          tags: document.getElementById("tags").value.split(",").map(s => s.trim().toLowerCase()).filter(Boolean),
          note: document.getElementById("note").value
        };

        const res = await callApi(payload);
        
        if (res.success) {
          closeModal();
          await loadTrips();
        } else {
          alert("Server error: " + (res.error || "Failed to save"));
        }
      } catch (err) {
        console.error(err);
        alert("Error saving: " + err.message);
      } finally {
        saveBtn.disabled = false;
        statusEl.textContent = "";
      }
    }

    // Delete Record
    async function deleteTrip(id) {
      if (!confirm("Are you sure you want to delete this district entry?")) return;

      try {
        const res = await callApi({ action: "deleteTrip", id: String(id) });
        if (res.success) {
          await loadTrips();
        } else {
          alert("Could not delete: " + res.error);
        }
      } catch (err) {
        alert("Delete failed: " + err.message);
      }
    }

    // Modal Control Helpers
    function openAddModal() {
      editingId = null; // Explicit reset for additions
      document.getElementById("tripForm").reset();
      document.getElementById("modalTitle").textContent = "Add New District";
      toggleDateInputs();
      document.getElementById("tripModal").classList.add("active");
    }

    function openEditModal(id) {
      const trip = trips.find(t => String(t.id) === String(id));
      if (!trip) return;

      editingId = String(trip.id); // Explicit tracking for updates
      document.getElementById("modalTitle").textContent = "Edit District Entry";
      
      document.getElementById("district").value = trip.district || "";
      document.getElementById("place").value = trip.place || "";
      document.getElementById("rating").value = trip.rating || 5;
      document.getElementById("tags").value = (trip.tags || []).join(", ");
      document.getElementById("note").value = trip.note || "";

      const dt = trip.dateType || "single";
      document.getElementById("dateType").value = dt;
      
      if (dt === "range" && trip.dateValue) {
        const parts = trip.dateValue.split(":");
        document.getElementById("dateFrom").value = parts[0] || "";
        document.getElementById("dateTo").value = parts[1] || "";
      } else {
        document.getElementById("dateVal").value = trip.dateValue || "";
      }

      toggleDateInputs();
      document.getElementById("tripModal").classList.add("active");
    }

    function closeModal() {
      editingId = null; // CRITICAL: Always reset on close
      document.getElementById("tripModal").classList.remove("active");
      document.getElementById("tripForm").reset();
    }

    function toggleDateInputs() {
      const dt = document.getElementById("dateType").value;
      if (dt === "range") {
        document.getElementById("singleDateGroup").style.display = "none";
        document.getElementById("rangeDateGroup").style.display = "block";
      } else {
        document.getElementById("singleDateGroup").style.display = "block";
        document.getElementById("rangeDateGroup").style.display = "none";
      }
    }

    // Formatting Utilities
    function formatDateValue(t) {
      if (!t.dateValue) return "No date";
      if (t.dateType === "range") {
        const parts = t.dateValue.split(":");
        return `${parts[0] || ""} to ${parts[1] || ""}`;
      }
      return t.dateValue;
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
